<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Travelmate request flow</title>
  <desc id="desc">A request passes through intent classification, memory, the planner, live searches, budget validation, and the evaluator before the final answer. Budget and quality failures can return to the planner up to two times.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#68766d"/></marker>
    <marker id="retry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a16a33"/></marker>
    <style>
      .box{fill:#fff;stroke:#b9c8bd;stroke-width:1.5}
      .agent{fill:#e8f1ff;stroke:#4b75b6}
      .tool{fill:#e9f5eb;stroke:#4f9864}
      .title{font:700 14px system-ui,sans-serif;fill:#24362c;text-anchor:middle}
      .detail{font:12px system-ui,sans-serif;fill:#4d5e54;text-anchor:middle}
      .line{fill:none;stroke:#68766d;stroke-width:2;marker-end:url(#arrow)}
      .retry{fill:none;stroke:#a16a33;stroke-width:1.7;stroke-dasharray:5 4;marker-end:url(#retry-arrow)}
      .retry-label{font:11px system-ui,sans-serif;fill:#865623;text-anchor:middle}
    </style>
  </defs>

  <path class="line" d="M220 61H260"/><path class="line" d="M450 61H490"/>
  <path class="line" d="M585 102V180"/>
  <path class="line" d="M490 221H450"/><path class="line" d="M260 221H220"/>
  <path class="line" d="M125 262V342"/><path class="line" d="M220 383H260"/>

  <path class="retry" d="M30 221H13V145H707V221H680"/>
  <text class="retry-label" x="360" y="138">Over budget: retry up to 2 times</text>
  <path class="retry" d="M30 383H13V465H707V221H680"/>
  <text class="retry-label" x="360" y="481">Score below 7: retry up to 2 times</text>

  <rect class="box" x="30" y="20" width="190" height="82" rx="12"/>
  <text class="title" x="125" y="57">User request</text>

  <rect class="box" x="260" y="20" width="190" height="82" rx="12"/>
  <text class="title" x="355" y="48">Intent classifier</text>
  <text class="detail" x="355" y="69">Understand intent &amp; constraints</text>

  <rect class="box" x="490" y="20" width="190" height="82" rx="12"/>
  <text class="title" x="585" y="46">Memory</text>
  <text class="detail" x="585" y="65">Update trip state &amp;</text>
  <text class="detail" x="585" y="81">conversation memory</text>

  <rect class="box agent" x="490" y="180" width="190" height="82" rx="12"/>
  <text class="title" x="585" y="215">Planner agent</text>
  <text class="detail" x="585" y="237">Build the itinerary</text>

  <rect class="box tool" x="260" y="180" width="190" height="82" rx="12"/>
  <text class="title" x="355" y="205">Search tools</text>
  <text class="detail" x="355" y="223">Real-time flights, hotels</text>
  <text class="detail" x="355" y="239">&amp; places when needed</text>

  <rect class="box tool" x="30" y="180" width="190" height="82" rx="12"/>
  <text class="title" x="125" y="214">Budget validation</text>
  <text class="detail" x="125" y="236">Check total cost</text>

  <rect class="box agent" x="30" y="342" width="190" height="82" rx="12"/>
  <text class="title" x="125" y="367">Evaluator agent</text>
  <text class="detail" x="125" y="385">Evaluate itinerary quality</text>
  <text class="detail" x="125" y="401">for full trip plans</text>

  <rect class="box" x="260" y="342" width="190" height="82" rx="12"/>
  <text class="title" x="355" y="390">Final answer</text>
</svg>
